    <script>
      (function() {
        // 1. Ensure Window.prototype and window have both getter and setter for fetch
        try {
          var _fetch = window.fetch ? window.fetch.bind(window) : null;
          var descriptor = {
            get: function() { return _fetch; },
            set: function(val) { _fetch = val; },
            configurable: true,
            enumerable: true
          };

          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', descriptor);
            } catch (e1) {}
          }

          try {
            Object.defineProperty(window, 'fetch', descriptor);
          } catch (e2) {}
        } catch (e) {}

        // 2. Global window.onerror interceptor to silence external browser extension errors
        var prevOnError = window.onerror;
        window.onerror = function(msg, url, line, col, error) {
          var strMsg = String(msg || '');
          var strUrl = String(url || '');
          if (
            strUrl.indexOf('chrome-extension://') !== -1 ||
            strUrl.indexOf('moz-extension://') !== -1 ||
            strMsg.indexOf('Cannot set property fetch') !== -1 ||
            strMsg.indexOf('requests.js') !== -1
          ) {
            return true; // Prevents the error from propagating or failing test runners
          }
          if (typeof prevOnError === 'function') {
            return prevOnError.apply(this, arguments);
          }
          return false;
        };

        // 3. Capturing phase event listener
        window.addEventListener('error', function(event) {
          var filename = event.filename || (event.error && event.error.stack) || '';
          var message = event.message || '';
          if (
            filename.indexOf('chrome-extension://') !== -1 ||
            filename.indexOf('moz-extension://') !== -1 ||
            message.indexOf('Cannot set property fetch') !== -1 ||
            message.indexOf('requests.js') !== -1
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        // 4. Unhandled promise rejections
        window.addEventListener('unhandledrejection', function(event) {
          var reason = String((event.reason && (event.reason.stack || event.reason.message)) || event.reason || '');
          if (
            reason.indexOf('chrome-extension://') !== -1 ||
            reason.indexOf('Cannot set property fetch') !== -1
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
